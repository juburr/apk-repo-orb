name: Inspect an APK repository's index
description: >
  Reads a signed APK repository's index from an S3 bucket and reports
  which packages it lists, without downloading any package: one read per
  architecture. For each architecture it verifies the index with your
  keyring and writes every package it lists (name, version, file and size)
  to a JSON receipt, so a pipeline can build only the versions the
  repository doesn't have yet. It never lists the bucket and writes nothing
  but the receipt. Needs the AWS CLI v2 (2.22.5 or newer) with credentials,
  python3 (3.8 or newer) and the openssl CLI.
  The GitHub Actions twin of the orb's inspect command.
author: juburr

inputs:
  backend:
    default: s3
    description: >
      Where the repository is stored. Only s3 (Amazon S3 and S3-compatible
      services) for now.
  bucket:
    description: >
      The bucket that holds the repository. Environment variables are
      expanded.
    required: true
  prefix:
    description: >
      The repository's key prefix in the bucket, such as my-org/os, with no
      leading or trailing /. Its packages are at <prefix>/<arch>/.
    required: true
  endpoint_url:
    default: ""
    description: >
      An S3-compatible service's endpoint, passed as --endpoint-url. It must
      be https://, or http:// to localhost. Empty (the default) is AWS.
  region:
    default: ""
    description: >
      The bucket's region. Empty (the default) leaves it to the AWS CLI
      (AWS_REGION, AWS_DEFAULT_REGION, its config). Environment variables
      are expanded.
  arch:
    default: ""
    description: >
      Architectures to inspect, space-separated: x86_64 and/or aarch64.
      Empty (the default) is the machine's own. Environment variables are
      expanded.
  keyring:
    description: >
      Public keys to trust, space-separated: files named <key>.rsa.pub, or
      directories whose *.rsa.pub files are all trusted, from your
      checkout. A key is never taken from the bucket. Environment variables
      are expanded.
    required: true
  index_sha256:
    default: ""
    description: >
      The SHA-256 the index must have, to inspect one snapshot of the
      repository again: the index.sha256 of an earlier receipt. One value
      for one architecture, or space-separated <arch>=<sha256> pairs, one
      for each in arch. An index with other bytes fails before it is read.
      Empty (the default) inspects the current index. Environment variables
      are expanded.
  index_version_id:
    default: ""
    description: >
      Which version of the index to read in a versioned bucket: the
      index.version_id of the receipt index_sha256 comes from, in the same
      forms. It needs index_sha256, and s3:GetObjectVersion. Without it, a
      pinned inspect fails once the index has changed. Empty (the default)
      reads the current version.
  allow_missing:
    default: "false"
    description: >
      Report an architecture with no index yet as an empty repository
      (index null, no packages) instead of failing, for a pipeline's first
      build. A 403 still fails, since it may hide an index, and so does a
      missing index that index_sha256 pins.
  receipt_path:
    default: apk-repo-receipt.json
    description: >
      Where to write the JSON receipt of what the index lists. Its absolute
      path is exported as APK_REPO_RECEIPT. Environment variables are
      expanded.
outputs:
  receipt:
    description: >
      The absolute path of the JSON receipt the step wrote (receipt_path),
      also in the APK_REPO_RECEIPT environment variable of later steps.
    value: ${{ steps.receipt.outputs.path }}

runs:
  using: composite
  steps:
    - name: Inspect APK repository index
      shell: bash
      env:
        PARAM_ALLOW_MISSING: ${{ inputs.allow_missing }}
        PARAM_ARCH: ${{ inputs.arch }}
        PARAM_BACKEND: ${{ inputs.backend }}
        PARAM_BUCKET: ${{ inputs.bucket }}
        PARAM_ENDPOINT_URL: ${{ inputs.endpoint_url }}
        PARAM_INDEX_SHA256: ${{ inputs.index_sha256 }}
        PARAM_INDEX_VERSION_ID: ${{ inputs.index_version_id }}
        PARAM_KEYRING: ${{ inputs.keyring }}
        PARAM_PREFIX: ${{ inputs.prefix }}
        PARAM_RECEIPT_PATH: ${{ inputs.receipt_path }}
        PARAM_REGION: ${{ inputs.region }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/inspect.sh"
        "SCRIPT_APK_REPO_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/apk_repo.sh"
        "SCRIPT_APK_REPO_PY=${GITHUB_ACTION_PATH}/../../src/scripts/apk_repo.py"
    # The script exported APK_REPO_RECEIPT through GITHUB_ENV; a
    # composite action's outputs come from a step's outputs.
    - name: Expose the receipt
      id: receipt
      shell: bash
      run: |
        delimiter="ghadelimiter_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
        printf 'path<<%s\n%s\n%s\n' "${delimiter}" "${APK_REPO_RECEIPT:-}" "${delimiter}" >> "${GITHUB_OUTPUT}"
