# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The local S3 server's credentials (tests/s3_server.sh); never real ones.
env:
  AWS_ACCESS_KEY_ID: apk-repo-test
  AWS_SECRET_ACCESS_KEY: apk-repo-test-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline tests
        run: |
          for test in tests/commands_test.sh tests/wiring_test.sh tests/actions_test.sh tests/env_subst_test.sh tests/shell_conventions_test.sh; do
            echo "=== ${test}"
            bash "${test}"
          done

  # T-3: verify accepts what real melange writes and refuses a one-byte change
  # in each signed segment.
  golden:
    strategy:
      fail-fast: false
      matrix:
        melange: ["0.61.2", "0.63.1"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: juburr/melange-orb/actions/install@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
        with:
          version: ${{ matrix.melange }}
      - name: Run the golden tests
        run: bash tests/golden_test.sh

  # T-4 and T-5 against versitygw, on both architectures.
  integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: juburr/melange-orb/actions/install@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
      - name: Show the tool versions
        run: |
          python3 --version
          openssl version
          aws --version
      - name: Start the S3 server
        run: bash tests/s3_server.sh apk-repo-test apk-repo-test-versions
      - name: Run the integration tests
        env:
          APK_REPO_BUCKET: apk-repo-test
          APK_REPO_VERSIONED_BUCKET: apk-repo-test-versions
          RACE_ROUNDS: "20"
        run: bash tests/integration_test.sh

  # T-6: melange builds a package, the actions publish, pull and verify it,
  # and apko builds an image from the pulled repository, which must run the
  # package's script.
  end-to-end:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: juburr/melange-orb/actions/install@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
      - uses: juburr/apko-orb/actions/install@86c2a8bd10def2c8cb0232184ef180213a27b0e5 # v1.2.1
      - name: Start the S3 server
        run: bash tests/s3_server.sh apk-repo-e2e
      # A build key for melange, and the repository's key, whose public half
      # goes in the keyring and private half in APK_SIGNING_KEY.
      - uses: juburr/melange-orb/actions/keygen@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
        with:
          signing_key: build.rsa
      - uses: juburr/melange-orb/actions/keygen@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
        with:
          signing_key: apk-repo-test.rsa
      - name: Move the repository's key into the keyring and APK_SIGNING_KEY
        run: |
          mkdir -p keyring
          mv apk-repo-test.rsa.pub keyring/
          delimiter="ghadelimiter_$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')"
          printf 'APK_SIGNING_KEY<<%s\n%s\n%s\n' "${delimiter}" "$(cat apk-repo-test.rsa)" "${delimiter}" >> "${GITHUB_ENV}"
          rm apk-repo-test.rsa
      # For this runner's architecture, into packages/<arch>.
      - uses: juburr/melange-orb/actions/build@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
        with:
          config: tests/fixtures/melange.yaml
          signing_key: build.rsa
      - id: inspect-before
        uses: ./actions/inspect
        with:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          allow_missing: "true"
          receipt_path: inspect-before.json
      - id: publish
        uses: ./actions/publish
        with:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          key_name: apk-repo-test.rsa
          allow_create: "true"
      - name: Check the publish receipt
        env:
          RECEIPT: ${{ steps.publish.outputs.receipt }}
        run: |
          [[ "${RECEIPT}" == "${GITHUB_WORKSPACE}/apk-repo-receipt.json" ]]
          [[ "${APK_REPO_RECEIPT}" == "${RECEIPT}" ]]
          python3 -I - "${RECEIPT}" "$(uname -m)" << 'EOF'
          import json, sys
          receipt, arch = json.load(open(sys.argv[1])), sys.argv[2]
          published = receipt["architectures"][arch]["published"]
          assert published == ["apk-repo-hello-0.0.1-r0.apk"], published
          assert receipt["architectures"][arch]["index"]["signature"] == ".SIGN.RSA256.apk-repo-test.rsa.pub"
          print("Published", published)
          EOF
      - id: inspect-after
        uses: ./actions/inspect
        with:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          receipt_path: inspect-after.json
      # inspect saw no repository before the publish (allow_missing), and
      # the package after it.
      - name: Check the inspect receipts
        env:
          BEFORE: ${{ steps.inspect-before.outputs.receipt }}
          AFTER: ${{ steps.inspect-after.outputs.receipt }}
        run: |
          [[ "${BEFORE}" == "${GITHUB_WORKSPACE}/inspect-before.json" ]]
          [[ "${AFTER}" == "${GITHUB_WORKSPACE}/inspect-after.json" ]]
          python3 -I - "${BEFORE}" "${AFTER}" "$(uname -m)" << 'EOF'
          import json, sys
          before, after, arch = (json.load(open(sys.argv[1])), json.load(open(sys.argv[2])), sys.argv[3])
          assert before["operation"] == after["operation"] == "inspect"
          assert before["architectures"][arch] == {"index": None, "packages": []}, before
          packages = after["architectures"][arch]["packages"]
          assert [p["file"] for p in packages] == ["apk-repo-hello-0.0.1-r0.apk"], packages
          assert packages[0]["sha256"] is None and packages[0]["size"] > 0, packages
          print("Before publishing, no repository; after,", [p["file"] for p in packages])
          EOF
      - id: pull
        uses: ./actions/pull
        with:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          out_dir: pulled
          receipt_path: pull-receipt.json
      - uses: ./actions/verify
        with:
          dir: pulled
          keyring: keyring
          receipt_path: verify-receipt.json
      - name: Check the pull and verify receipts
        env:
          PULL_RECEIPT: ${{ steps.pull.outputs.receipt }}
        run: |
          [[ "${PULL_RECEIPT}" == "${GITHUB_WORKSPACE}/pull-receipt.json" ]]
          [[ -f verify-receipt.json ]]
      - uses: juburr/apko-orb/actions/build@86c2a8bd10def2c8cb0232184ef180213a27b0e5 # v1.2.1
        with:
          config: tests/fixtures/apko.yaml
          image: apk-repo-e2e:latest
          arch: host
          log_level: info
          output_path: image/e2e.tar
      - name: Run the image
        run: |
          case "$(uname -m)" in
            x86_64) tag=amd64 ;;
            aarch64) tag=arm64 ;;
          esac
          docker load --input image/e2e.tar
          OUTPUT=$(docker run --rm "apk-repo-e2e:latest-${tag}")
          echo "${OUTPUT}"
          if [[ "${OUTPUT}" != "hello from apk-repo-orb" ]]; then
            echo "The image didn't run the pulled package's script."
            exit 1
          fi
      # A second version beside the first, and a selective pull of the
      # first: apko pinned to it must run its script, and apko unpinned
      # must fail on the second, which the index lists and the pull didn't
      # fetch.
      - uses: juburr/melange-orb/actions/build@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
        with:
          config: tests/fixtures/melange-next.yaml
          signing_key: build.rsa
      - uses: ./actions/publish
        with:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          key_name: apk-repo-test.rsa
          receipt_path: publish-next.json
      - uses: ./actions/pull
        with:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          out_dir: selected
          packages: apk-repo-hello=0.0.1-r0
          receipt_path: pull-selected.json
      - uses: ./actions/verify
        with:
          dir: selected
          keyring: keyring
          packages: apk-repo-hello=0.0.1-r0
          receipt_path: verify-selected.json
      - name: Check the selective pull
        run: |
          python3 -I - publish-next.json pull-selected.json verify-selected.json "$(uname -m)" << 'EOF'
          import json, os, sys
          publish, pull, verify = (json.load(open(path)) for path in sys.argv[1:4])
          arch = sys.argv[4]
          assert publish["architectures"][arch]["published"] == ["apk-repo-hello-0.0.2-r0.apk"], publish
          assert publish["architectures"][arch]["skipped_identical"] == ["apk-repo-hello-0.0.1-r0.apk"], publish
          for receipt in (pull, verify):
              assert receipt["architectures"][arch]["selection"] == ["apk-repo-hello=0.0.1-r0"], receipt
              files = [p["file"] for p in receipt["architectures"][arch]["packages"]]
              assert files == ["apk-repo-hello-0.0.1-r0.apk"], files
          pulled = sorted(name for name in os.listdir(os.path.join("selected", arch)) if name.endswith(".apk"))
          assert pulled == ["apk-repo-hello-0.0.1-r0.apk"], pulled
          print("The index lists 0.0.1 and 0.0.2; the selective pull fetched", pulled)
          EOF
      - uses: juburr/apko-orb/actions/build@86c2a8bd10def2c8cb0232184ef180213a27b0e5 # v1.2.1
        with:
          config: tests/fixtures/apko-selected.yaml
          image: apk-repo-selected:latest
          arch: host
          log_level: info
          output_path: image/selected.tar
      - name: Run the image built from the selective pull
        run: |
          case "$(uname -m)" in
            x86_64) tag=amd64 ;;
            aarch64) tag=arm64 ;;
          esac
          docker load --input image/selected.tar
          OUTPUT=$(docker run --rm "apk-repo-selected:latest-${tag}")
          echo "${OUTPUT}"
          if [[ "${OUTPUT}" != "hello from apk-repo-orb" ]]; then
            echo "The image didn't run 0.0.1's script, the version pulled."
            exit 1
          fi
      - name: apko refuses the selective pull without the version pin
        run: |
          if apko build tests/fixtures/apko-unpinned.yaml apk-repo-unpinned:latest image/unpinned.tar \
              --arch "$(uname -m)" > unpinned.log 2>&1; then
            tail -n 20 unpinned.log
            echo "apko built an image without the pin; the README's advice to pin apko needs revisiting."
            exit 1
          fi
          tail -n 20 unpinned.log
          if ! grep -q 'apk-repo-hello-0.0.2-r0' unpinned.log; then
            echo "apko failed, but not on apk-repo-hello 0.0.2, the version the pull didn't fetch."
            exit 1
          fi
          echo "As the README says, apko unpinned picks 0.0.2, which the selective pull didn't fetch, and fails."
