version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  apk-repo-orb: {}
  melange-orb: juburr/melange-orb@1.3.0
  apko-orb: juburr/apko-orb@1.2.1

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

# The local S3 server's credentials (tests/s3_server.sh); never real ones.
s3-environment: &s3-environment
  AWS_ACCESS_KEY_ID: apk-repo-test
  AWS_SECRET_ACCESS_KEY: apk-repo-test-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

executors:
  # melange's docker runner and the S3 server need a Docker daemon of their own.
  machine-amd64:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
  machine-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium

commands:
  show-tools:
    steps:
      - run:
          name: Show the tool versions
          command: |
            uname -m
            python3 --version
            openssl version
            aws --version
            melange version 2>&1 | grep -i gitversion || true
  # The keys and the package the pipelines publish: a build key for melange, and the
  # repository's key, whose public half goes in the keyring and private half in APK_SIGNING_KEY.
  make-test-package:
    steps:
      - melange-orb/keygen:
          signing_key: build.rsa
      - melange-orb/keygen:
          signing_key: apk-repo-test.rsa
      - run:
          name: Move the repository's key into the keyring and APK_SIGNING_KEY
          command: |
            mkdir -p keyring
            mv apk-repo-test.rsa.pub keyring/
            printf 'export %s=%q\n' APK_SIGNING_KEY "$(cat apk-repo-test.rsa)" >> "${BASH_ENV}"
            rm apk-repo-test.rsa
      # For this machine's architecture, into packages/<arch>.
      - melange-orb/build:
          config: tests/fixtures/melange.yaml
          signing_key: build.rsa
  check-publish-receipt:
    steps:
      - run:
          name: Check the publish receipt
          command: |
            python3 -I - "${APK_REPO_RECEIPT}" "$(uname -m)" \<< 'EOF'
            import json, sys
            receipt, arch = json.load(open(sys.argv[1])), sys.argv[2]
            published = receipt["architectures"][arch]["published"]
            assert published == ["apk-repo-hello-0.0.1-r0.apk"], published
            index = receipt["architectures"][arch]["index"]
            assert index["signature"] == ".SIGN.RSA256.apk-repo-test.rsa.pub"
            print("Published", published, "to", receipt["bucket"], "at", receipt["prefix"])
            print("The index's version_id is", index["version_id"])
            EOF
  # inspect saw no repository before the publish (allow_missing), and the package after it.
  check-inspect-receipts:
    steps:
      - run:
          name: Check the inspect receipts
          command: |
            python3 -I - inspect-before.json inspect-after.json "$(uname -m)" \<< 'EOF'
            import json, sys
            before, after, arch = (json.load(open(sys.argv[1])), json.load(open(sys.argv[2])), sys.argv[3])
            assert before["operation"] == after["operation"] == "inspect"
            assert before["architectures"][arch] == {"index": None, "packages": []}, before
            packages = after["architectures"][arch]["packages"]
            assert [p["file"] for p in packages] == ["apk-repo-hello-0.0.1-r0.apk"], packages
            assert packages[0]["sha256"] is None and packages[0]["size"] > 0, packages
            print("Before publishing, no repository; after,", [p["file"] for p in packages])
            EOF
  # A selective pull (packages) of 0.0.1, with 0.0.2 published beside it: only 0.0.1 is
  # pulled, the whole index with it, and verify accepts it with the same packages.
  check-selective-pull:
    steps:
      - run:
          name: Check the selective pull
          command: |
            python3 -I - publish-next.json pull-selected.json verify-selected.json "$(uname -m)" \<< 'EOF'
            import json, os, sys
            publish, pull, verify = (json.load(open(path)) for path in sys.argv[1:4])
            arch = sys.argv[4]
            assert publish["architectures"][arch]["published"] == ["apk-repo-hello-0.0.2-r0.apk"], publish
            assert publish["architectures"][arch]["skipped_identical"] == ["apk-repo-hello-0.0.1-r0.apk"], publish
            for receipt in (pull, verify):
                assert receipt["architectures"][arch]["selection"] == ["apk-repo-hello=0.0.1-r0"], receipt
                files = [p["file"] for p in receipt["architectures"][arch]["packages"]]
                assert files == ["apk-repo-hello-0.0.1-r0.apk"], files
            pulled = sorted(name for name in os.listdir(os.path.join("selected", arch)) if name.endswith(".apk"))
            assert pulled == ["apk-repo-hello-0.0.1-r0.apk"], pulled
            print("The index lists 0.0.1 and 0.0.2; the selective pull fetched", pulled)
            EOF
  # apko builds images from the selective pull: pinned to 0.0.1, it must run 0.0.1's script;
  # unpinned, it must fail on 0.0.2, which the index lists and the pull didn't fetch.
  run-selected-image:
    steps:
      - apko-orb/build:
          config: tests/fixtures/apko-selected.yaml
          image: apk-repo-selected:latest
          arch: host
          log_level: info
          output_path: image/selected.tar
      - run:
          name: Run the image built from the selective pull
          command: |
            case "$(uname -m)" in
              x86_64) tag=amd64 ;;
              aarch64) tag=arm64 ;;
            esac
            docker load --input image/selected.tar
            OUTPUT=$(docker run --rm "apk-repo-selected:latest-${tag}")
            echo "${OUTPUT}"
            if [[ "${OUTPUT}" != "hello from apk-repo-orb" ]]; then
              echo "The image didn't run 0.0.1's script, the version pulled."
              exit 1
            fi
      - run:
          name: apko refuses the selective pull without the version pin
          command: |
            if apko build tests/fixtures/apko-unpinned.yaml apk-repo-unpinned:latest image/unpinned.tar \
                --arch "$(uname -m)" > unpinned.log 2>&1; then
              tail -n 20 unpinned.log
              echo "apko built an image without the pin; the README's advice to pin apko needs revisiting."
              exit 1
            fi
            tail -n 20 unpinned.log
            if ! grep -q 'apk-repo-hello-0.0.2-r0' unpinned.log; then
              echo "apko failed, but not on apk-repo-hello 0.0.2, the version the pull didn't fetch."
              exit 1
            fi
            echo "As the README says, apko unpinned picks 0.0.2, which the selective pull didn't fetch, and fails."
  # apko builds an image from the pulled repository, which must run the package's script.
  run-test-image:
    steps:
      - apko-orb/build:
          config: tests/fixtures/apko.yaml
          image: apk-repo-e2e:latest
          arch: host
          log_level: info
          output_path: image/e2e.tar
      - run:
          name: Run the image
          command: |
            case "$(uname -m)" in
              x86_64) tag=amd64 ;;
              aarch64) tag=arm64 ;;
            esac
            docker load --input image/e2e.tar
            OUTPUT=$(docker run --rm "apk-repo-e2e:latest-${tag}")
            echo "${OUTPUT}"
            if [[ "${OUTPUT}" != "hello from apk-repo-orb" ]]; then
              echo "The image didn't run the pulled package's script."
              exit 1
            fi

jobs:
  # T-3: verify accepts what real melange writes (melange build, sign and index, and an index
  # merge) and refuses a one-byte change in each signed segment.
  golden-test:
    parameters:
      melange_version:
        type: string
    executor: machine-amd64
    steps:
      - checkout
      - melange-orb/install:
          version: << parameters.melange_version >>
      - run:
          name: Run the golden tests
          command: bash tests/golden_test.sh
  # T-4 and T-5: publish, pull and verify with the real AWS CLI and melange against versitygw,
  # which tests/s3_server.sh first proves answers 412 to failed conditional writes (F-14,
  # F-15), then 20 rounds of two publishes at once. Pinned pulls read an earlier version of
  # an index from a second, versioned bucket.
  integration-test:
    parameters:
      melange_version:
        type: string
    executor: machine-amd64
    environment: *s3-environment
    steps:
      - checkout
      - melange-orb/install:
          version: << parameters.melange_version >>
      - show-tools
      - run:
          name: Start the S3 server
          command: bash tests/s3_server.sh apk-repo-test apk-repo-test-versions
      - run:
          name: Run the integration tests
          command: bash tests/integration_test.sh
          environment:
            APK_REPO_BUCKET: apk-repo-test
            APK_REPO_VERSIONED_BUCKET: apk-repo-test-versions
            RACE_ROUNDS: "20"
  # T-6: the orb's commands as a pipeline runs them: melange builds a package, publish uploads
  # it, pull fetches it into a fresh directory, verify checks it, and apko builds an image from
  # it, which must run the package's script. Then a second version is published, and a
  # selective pull of the first must give an image that runs the first's script, as long as
  # apko is pinned to it.
  end-to-end-test:
    parameters:
      executor:
        type: executor
    executor: << parameters.executor >>
    environment: *s3-environment
    steps:
      - checkout
      - melange-orb/install
      - apko-orb/install
      - show-tools
      - run:
          name: Start the S3 server
          command: bash tests/s3_server.sh apk-repo-e2e
      - make-test-package
      - apk-repo-orb/inspect:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          allow_missing: true
          receipt_path: inspect-before.json
      - apk-repo-orb/publish:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          key_name: apk-repo-test.rsa
          allow_create: true
      - check-publish-receipt
      - apk-repo-orb/inspect:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          receipt_path: inspect-after.json
      - check-inspect-receipts
      - apk-repo-orb/pull:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          out_dir: pulled
      - apk-repo-orb/verify:
          dir: pulled
          keyring: keyring
      - run-test-image
      # A second version beside the first, and a selective pull of the first.
      - melange-orb/build:
          config: tests/fixtures/melange-next.yaml
          signing_key: build.rsa
      - apk-repo-orb/publish:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          key_name: apk-repo-test.rsa
          receipt_path: publish-next.json
      - apk-repo-orb/pull:
          bucket: apk-repo-e2e
          prefix: e2e/os
          endpoint_url: http://localhost:7070
          keyring: keyring
          out_dir: selected
          packages: apk-repo-hello=0.0.1-r0
          receipt_path: pull-selected.json
      - apk-repo-orb/verify:
          dir: selected
          keyring: keyring
          packages: apk-repo-hello=0.0.1-r0
          receipt_path: verify-selected.json
      - check-selective-pull
      - run-selected-image
  # T-7: the integration tests (10 race rounds) and the end-to-end pipeline against Amazon S3
  # itself, with the IAM user and bucket in the s3_apk_test_rw context (AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_S3_BUCKET_NAME). Each run writes under its own
  # prefix in apk-repo-orb-ci/, which a lifecycle rule on the bucket expires, since the orb
  # never deletes. Without AWS_S3_BUCKET_NAME the job stops at its first step and passes,
  # except on a tag: a release must not be published untested against Amazon S3.
  aws-s3-test:
    executor: machine-amd64
    steps:
      - run:
          name: Skip without a bucket
          command: |
            if [[ -z "${AWS_S3_BUCKET_NAME:-}" ]]; then
              if [[ -n "${CIRCLE_TAG:-}" ]]; then
                echo "ERROR: AWS_S3_BUCKET_NAME isn't set (it comes from the s3_apk_test_rw context), and ${CIRCLE_TAG} can't be released without the Amazon S3 tests." >&2
                exit 1
              fi
              echo "AWS_S3_BUCKET_NAME isn't set (it comes from the s3_apk_test_rw context): skipping the Amazon S3 tests."
              circleci-agent step halt
            fi
      - checkout
      - melange-orb/install
      - apko-orb/install
      - show-tools
      - run:
          name: Choose this run's prefix
          command: |
            prefix="apk-repo-orb-ci/${CIRCLE_WORKFLOW_ID}-${CIRCLE_BUILD_NUM}"
            printf 'export %s=%q\n' APK_REPO_TEST_PREFIX "${prefix}" >> "${BASH_ENV}"
            echo "This run writes under s3://${AWS_S3_BUCKET_NAME}/${prefix}/ in ${AWS_REGION:-the default region of the AWS CLI}."
      - run:
          name: Run the integration tests against Amazon S3
          command: |
            APK_REPO_BUCKET="${AWS_S3_BUCKET_NAME}" APK_REPO_ENDPOINT='' APK_REPO_PREFIX="${APK_REPO_TEST_PREFIX}" \
              bash tests/integration_test.sh
          environment:
            RACE_ROUNDS: "10"
      - make-test-package
      # The orb's commands expand the variables in their parameters.
      - apk-repo-orb/inspect:
          bucket: ${AWS_S3_BUCKET_NAME}
          prefix: ${APK_REPO_TEST_PREFIX}/e2e/os
          keyring: keyring
          allow_missing: true
          receipt_path: inspect-before.json
      - apk-repo-orb/publish:
          bucket: ${AWS_S3_BUCKET_NAME}
          prefix: ${APK_REPO_TEST_PREFIX}/e2e/os
          keyring: keyring
          key_name: apk-repo-test.rsa
          allow_create: true
      - check-publish-receipt
      - apk-repo-orb/inspect:
          bucket: ${AWS_S3_BUCKET_NAME}
          prefix: ${APK_REPO_TEST_PREFIX}/e2e/os
          keyring: keyring
          receipt_path: inspect-after.json
      - check-inspect-receipts
      - apk-repo-orb/pull:
          bucket: ${AWS_S3_BUCKET_NAME}
          prefix: ${APK_REPO_TEST_PREFIX}/e2e/os
          keyring: keyring
          out_dir: pulled
      - apk-repo-orb/verify:
          dir: pulled
          keyring: keyring
      - run-test-image

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      - golden-test:
          matrix:
            parameters:
              melange_version: ["0.61.2", "0.63.1"]
          filters: *filters
      - integration-test:
          matrix:
            parameters:
              melange_version: ["0.61.2", "0.63.1"]
          filters: *filters
      - end-to-end-test:
          matrix:
            parameters:
              executor: [machine-amd64, machine-arm64]
          filters: *filters
      - aws-s3-test:
          context: s3_apk_test_rw
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/apk-repo-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - golden-test
            - integration-test
            - end-to-end-test
            - aws-s3-test
          context: orb-publishing
          filters: *release-filters
